corpus_id: schumacher_clean
manifest_path: ../data/manifests/clean_documents.jsonl

retriever:
  type: lightrag
  working_directory: ../indices/schumacher_clean
  query_mode: local
  chunk_token_size: 512
  chunk_overlap_token_size: 100
  enable_rerank: false
  lightrag_llm:
    provider: openai_compatible
    base_url: ${RAGCV_LIGHTRAG_LLM_BASE_URL:-http://127.0.0.1:1234/v1}
    api_key_env: RAGCV_LIGHTRAG_LLM_API_KEY
    api_key_required: false
    model: ${RAGCV_LIGHTRAG_LLM_MODEL:-qwen/qwen3-4b-2507}
    temperature: 0.0
    timeout_seconds: 1200
    max_retries: 2
  embedding:
    provider: openai_compatible
    base_url: ${RAGCV_EMBEDDING_BASE_URL:-http://127.0.0.1:1234/v1}
    api_key_env: RAGCV_EMBEDDING_API_KEY
    api_key_required: false
    model: ${RAGCV_EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}
    dimension: ${RAGCV_EMBEDDING_DIMENSION:-768}
    max_token_size: 8192
    timeout_seconds: 3600

verification_model:
  provider: openai_compatible
  base_url: ${RAGCV_LLM_BASE_URL:-http://127.0.0.1:1234/v1}
  api_key_env: RAGCV_LLM_API_KEY
  api_key_required: false
  model: ${RAGCV_LLM_MODEL:-qwen/qwen3-4b-2507}
  temperature: 0.0
  timeout_seconds: 120
  max_retries: 2
  request_json_object: true

prompts:
  version: verification-v1
  system_path: ../prompts/verification_system.txt
  user_path: ../prompts/verification_user.txt
  repair_path: ../prompts/verification_repair.txt
