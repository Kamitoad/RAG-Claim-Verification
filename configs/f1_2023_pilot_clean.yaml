corpus_id: f1_2023_pilot_clean_jolpica_podium_v4
manifest_path: ../data/manifests/local/f1_2023_pilot_v3_clean.jsonl

retriever:
  type: lightrag
  working_directory: ../indices/f1_2023_pilot_clean_jolpica_podium_v4
  query_mode: hybrid
  chunk_token_size: 1800
  chunk_overlap_token_size: 150
  enable_rerank: false
  llm_model_max_async: 1
  entity_extract_max_gleaning: 0
  max_parallel_insert: 1
  lightrag_llm:
    provider: openai_compatible
    base_url: http://127.0.0.1:11434/v1
    api_key_env: RAGCV_LOCAL_UNUSED_API_KEY
    api_key_required: false
    model: ${RAGCV_LOCAL_LLM_MODEL:-ragcv-qwen3-4b-pilot:v1}
    temperature: 0.0
    seed: 17
    timeout_seconds: 300
    max_retries: 1
  embedding:
    provider: fastembed
    model: jinaai/jina-embeddings-v2-small-en
    dimension: 512
    max_token_size: 8192
    timeout_seconds: 300

verification_model:
  provider: openai_compatible
  base_url: http://127.0.0.1:11434/v1
  api_key_env: RAGCV_LOCAL_UNUSED_API_KEY
  api_key_required: false
  model: ${RAGCV_LOCAL_LLM_MODEL:-ragcv-qwen3-4b-pilot:v1}
  temperature: 0.0
  seed: 17
  timeout_seconds: 300
  max_retries: 1
  request_json_object: true

prompts:
  version: verification-v3-baseline-knowledge
  system_path: ../prompts/verification_system_v3_baseline_knowledge.txt
  user_path: ../prompts/verification_user.txt
  repair_path: ../prompts/verification_repair.txt
