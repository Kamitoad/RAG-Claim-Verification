[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-claim-verification"
version = "0.1.0"
description = "Modular RAG system for domain-specific claim verification and retrieval evaluation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RAG Claim Verification research project" }]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0.2,<7",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
lightrag = ["lightrag-hku==1.5.4"]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
rag-claim-verification = "rag_claim_verification.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_claim_verification = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "external: requires an external API or a real LightRAG installation and index",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rag_claim_verification"]
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
